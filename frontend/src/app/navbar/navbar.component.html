<!-- Navbar -->
<div class="bg-white shadow py-4">
  <div class="container mx-auto px-4 flex items-center justify-between">
    <!-- Logo -->
    <img
      src="https://res.cloudinary.com/dgtfgihga/image/upload/v1753714978/Screenshot_2025-07-28_203234_gmzguo.png"
      alt="logo"
      class="h-10 cursor-pointer"
      routerLink="/"
    />

    <!-- Center links (only visible on md and above) -->
    <div class="hidden md:flex gap-6 text-sm sm:text-base">
      <a routerLink="/" class="text-gray-700 hover:text-blue-600 font-medium">Home</a>
      <a routerLink="/applications" class="text-gray-700 hover:text-blue-600 font-medium">Applied Jobs</a>
    </div>

    <!-- Right side -->
    <div class="hidden md:flex items-center gap-4">
      <h1><span class="font-semibold">Hello,</span> {{ username }}</h1>
      <button
        class="bg-blue-600 text-white px-6 py-2 rounded-full"
        (click)="logout()"
      >
        Logout
      </button>
    </div>

    <!-- Hamburger icon (only visible on small and medium) -->
    <div class="md:hidden">
      <button (click)="isSidebarOpen = !isSidebarOpen">
        <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- Sidebar for mobile and tablet -->
<div
  class="fixed top-0 left-0 w-64 h-full bg-white shadow transform transition-transform duration-300 z-50 md:hidden"
  [ngClass]="{ '-translate-x-full': !isSidebarOpen, 'translate-x-0': isSidebarOpen }"
>
  <div class="p-6 space-y-4">
    <h1 class="text-xl font-semibold mb-4">Hello, {{ username }}</h1>
    <a routerLink="/" class="block text-gray-700 hover:text-blue-600 font-medium">Home</a>
    <a routerLink="/applications" class="block text-gray-700 hover:text-blue-600 font-medium">Applied Jobs</a>
    <button
      class="mt-6 bg-blue-600 text-white px-4 py-2 rounded-full w-full"
      (click)="logout()"
    >
      Logout
    </button>
  </div>
</div>
