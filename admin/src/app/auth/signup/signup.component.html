<form #signupForm="ngForm" (ngSubmit)="onSignUp()"
    class="flex flex-col justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Recruiter Sign Up</h1>
            <p class="text-gray-600 text-sm">Welcome back! Please sign up to continue</p>
        </div>

        <div class="space-y-4">
            <div class="mt-4 text-center">
                <label for="logo" class="text-gray-800 m-2">Company Logo</label>
                <img class="mx-auto" (click)="openFiles()" *ngIf="imagePreview" [src]="imagePreview" alt="Image Preview"
                    width="100" />
            </div>

            <div>
                <input #fileInput id="logo" type="file" name="logo" (change)="onChangeLogo($event)" accept="image/*"
                    [required]="true"
                    class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-700 bg-white file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                <p class="text-red-500 text-sm mt-1" *ngIf="signupForm.submitted && !image ">logo is required</p>
            </div>
            <div>
                <input type="text" placeholder="Company Name" required [(ngModel)]="name" name="name"
                    #nameInput="ngModel"
                    class="text-gray-400 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p class="text-red-500 text-sm mt-1" *ngIf="nameInput.invalid && signupForm.submitted">company name is
                    required</p>
            </div>
            <div>
                <input type="text" placeholder="google@demo.com" required [(ngModel)]="email" name="email"
                    #emailInput="ngModel"
                    class="text-gray-400 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p class="text-red-500 text-sm mt-1" *ngIf="emailInput.invalid && signupForm.submitted">email is
                    required</p>
            </div>
            <div>
                <input type="password" placeholder="Password" required [(ngModel)]="password" name="password"
                    #passwordInput="ngModel" minlength="6"
                    class="text-gray-400 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p class="text-red-500 text-sm mt-1"
                    *ngIf="passwordInput.invalid && passwordInput.touched && signupForm.submitted">password is
                    required</p>
            </div>
            <button type="submit"
                [disabled]="!signupForm.form.valid || !image || nameInput.invalid || emailInput.invalid || passwordInput.invalid"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-300">Sign
                Up</button>
        </div>
        <p class="mt-4 text-center text-sm text-gray-600">
            Already have an account?
            <span class="text-blue-700 font-semibold cursor-pointer hover:underline" routerLink="/login">Login</span>
        </p>
    </div>
</form>
