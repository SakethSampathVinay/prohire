<form #loginForm="ngForm" (ngSubmit)="onLogin()"
    class="flex flex-col justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Recruiter Login</h1>
            <p class="text-gray-600 text-sm">Welcome back! Please sign in to continue</p>
        </div>

        <div class="space-y-4">
            <div>
                <input type="email" placeholder="Email" required [(ngModel)]="data.email" name="email" #emailInput="ngModel"
                    class="text-gray-700 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p class="text-red-500 text-sm mt-1" *ngIf="emailInput.invalid && loginForm.submitted">
                    Email is required
                </p>
            </div>

            <div>
                <input type="password" placeholder="Password" required [(ngModel)]="data.password" name="password"
                    #passwordInput="ngModel" minlength="6"
                    class="text-gray-700 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p class="text-red-500 text-sm mt-1" *ngIf="passwordInput.invalid && loginForm.submitted">
                    Password is required (min 6 characters)
                </p>
            </div>

            <button type="submit" [disabled]="!loginForm.form.valid || passwordInput.invalid || emailInput.invalid"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-300">
                Login
            </button>
        </div>

        <p class="mt-4 text-center text-sm text-gray-600">
            Don’t have an account?
            <span class="text-blue-700 font-semibold cursor-pointer hover:underline" routerLink="/register">
                Sign Up
            </span>
        </p>
    </div>
</form>
