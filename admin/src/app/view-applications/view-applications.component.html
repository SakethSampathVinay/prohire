<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">#</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">user name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Job Title
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Location</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Resume</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Status</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200" *ngFor = "let item of application; let i = index" >
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{i+1}}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{item.username}}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{item.title}}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{item.location}}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <a [href]="item.resumeUrl" target="_blank"
                        class="bg-blue-100 text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-200 transition">View
                        Resume</a>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <select 
                        class="border border-gray-300 rounded-md px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Accepted">Accepted</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </td>
            </tr>
        </tbody>
    </table>
</div>
